<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Anonymous mark: no glyph, no silhouette. Just the aurora's greys and
       brasses drifting inside a rounded black tile. Same rx as favicon.svg. -->
  <defs>
    <clipPath id="tile">
      <rect x="1" y="1" width="30" height="30" rx="7" />
    </clipPath>

    <radialGradient id="a1"><stop offset="0%" stop-color="#7a7571" /><stop offset="100%" stop-color="#7a7571" stop-opacity="0" /></radialGradient>
    <radialGradient id="a2"><stop offset="0%" stop-color="#beb5b2" /><stop offset="100%" stop-color="#beb5b2" stop-opacity="0" /></radialGradient>
    <radialGradient id="a3"><stop offset="0%" stop-color="#eee5df" /><stop offset="100%" stop-color="#eee5df" stop-opacity="0" /></radialGradient>
    <radialGradient id="a4"><stop offset="0%" stop-color="#bfa688" /><stop offset="100%" stop-color="#bfa688" stop-opacity="0" /></radialGradient>
    <radialGradient id="a5"><stop offset="0%" stop-color="#b07c3f" /><stop offset="100%" stop-color="#b07c3f" stop-opacity="0" /></radialGradient>
    <radialGradient id="a6"><stop offset="0%" stop-color="#332f2c" /><stop offset="100%" stop-color="#332f2c" stop-opacity="0" /></radialGradient>

    <filter id="soften-anon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
  </defs>

  <rect x="1" y="1" width="30" height="30" rx="7" fill="#0b0a0a" />

  <g clip-path="url(#tile)">
    <g filter="url(#soften-anon)" opacity="0.9">
      <ellipse cx="8" cy="8" rx="12" ry="10" fill="url(#a1)" />
      <ellipse cx="15" cy="11" rx="10" ry="8" fill="url(#a2)" />
      <ellipse cx="20" cy="13" rx="8" ry="6" fill="url(#a3)" />
      <ellipse cx="25" cy="19" rx="10" ry="9" fill="url(#a4)" />
      <ellipse cx="17" cy="25" rx="10" ry="8" fill="url(#a5)" />
      <ellipse cx="5" cy="23" rx="9" ry="9" fill="url(#a6)" />
      <ellipse cx="28" cy="6" rx="9" ry="7" fill="url(#a6)" />
    </g>
  </g>

  <!-- a hair of edge definition so the tile reads on light tab bars -->
  <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="6.6" fill="none" stroke="#2a2724" stroke-width="0.8" />
</svg>
