<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Loose arch mass: reads as a helmet dome and a robot head at once.
         No cheek plates, no plume, no literal eyes. A seam splits the mass
         down the middle and one visor band crosses it. -->
    <clipPath id="mark">
      <path d="M7.6 13.4 A8.4 8.4 0 0 1 24.4 13.4 V24 A2.6 2.6 0 0 1 21.8 26.6
               H10.2 A2.6 2.6 0 0 1 7.6 24 Z" />
    </clipPath>

    <radialGradient id="g1"><stop offset="0%" stop-color="#7a7571" /><stop offset="100%" stop-color="#7a7571" stop-opacity="0" /></radialGradient>
    <radialGradient id="g2"><stop offset="0%" stop-color="#beb5b2" /><stop offset="100%" stop-color="#beb5b2" stop-opacity="0" /></radialGradient>
    <radialGradient id="g3"><stop offset="0%" stop-color="#eee5df" /><stop offset="100%" stop-color="#eee5df" stop-opacity="0" /></radialGradient>
    <radialGradient id="g4"><stop offset="0%" stop-color="#d2cdcb" /><stop offset="100%" stop-color="#d2cdcb" stop-opacity="0" /></radialGradient>
    <radialGradient id="g5"><stop offset="0%" stop-color="#c1904f" /><stop offset="100%" stop-color="#c1904f" stop-opacity="0" /></radialGradient>
    <radialGradient id="g6"><stop offset="0%" stop-color="#bfa688" /><stop offset="100%" stop-color="#bfa688" stop-opacity="0" /></radialGradient>
    <radialGradient id="g7"><stop offset="0%" stop-color="#b07c3f" /><stop offset="100%" stop-color="#b07c3f" stop-opacity="0" /></radialGradient>
    <radialGradient id="g8"><stop offset="0%" stop-color="#332f2c" /><stop offset="100%" stop-color="#332f2c" stop-opacity="0" /></radialGradient>

    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
  </defs>

  <rect width="32" height="32" rx="6" fill="#0a0a0b" />

  <g clip-path="url(#mark)">
    <rect width="32" height="32" fill="#514b47" />
    <g filter="url(#soften)">
      <ellipse cx="27" cy="6" rx="9" ry="7" fill="url(#g8)" />
      <ellipse cx="8" cy="7" rx="11" ry="9" fill="url(#g1)" />
      <ellipse cx="15" cy="9" rx="10" ry="8" fill="url(#g2)" />
      <ellipse cx="20" cy="12" rx="8" ry="6" fill="url(#g3)" />
      <ellipse cx="11" cy="14" rx="7" ry="6" fill="url(#g4)" />
      <ellipse cx="25" cy="17" rx="10" ry="9" fill="url(#g5)" />
      <ellipse cx="16" cy="20" rx="9" ry="8" fill="url(#g6)" />
      <ellipse cx="17" cy="27" rx="8" ry="6" fill="url(#g7)" />
      <ellipse cx="6" cy="20" rx="7" ry="8" fill="url(#g8)" />
    </g>
  </g>

  <!-- the cuts that do the suggesting: a seam splitting the mass, and one
       visor band across it -->
  <g fill="#0a0a0b">
    <rect x="15.1" y="1.5" width="1.8" height="26" />
    <rect x="9.4" y="15.6" width="13.2" height="3.6" rx="1.8" />
  </g>
</svg>
